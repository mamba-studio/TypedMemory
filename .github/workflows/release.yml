name: Release

on:
  push:
    branches:
      - main
    paths:
      - pom.xml
  workflow_dispatch:
    inputs:
      version:
        description: "Project version to release (for example, 0.1.6)"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a prerelease"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Determine and validate release version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          PROJECT_VERSION="$(mvn --batch-mode help:evaluate -Dexpression=project.version -q -DforceStdout)"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${REQUESTED_VERSION#v}"
            if [[ "$PROJECT_VERSION" != "$VERSION" ]]; then
              echo "Requested version $VERSION does not match pom.xml version $PROJECT_VERSION." >&2
              exit 1
            fi
          else
            VERSION="$PROJECT_VERSION"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi

          LATEST_VERSION="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)"
          LATEST_VERSION="${LATEST_VERSION#v}"

          if [[ -n "$LATEST_VERSION" ]]; then
            HIGHEST_VERSION="$(printf '%s\n%s\n' "$LATEST_VERSION" "$VERSION" | sort -V | tail -n 1)"
            if [[ "$VERSION" == "$LATEST_VERSION" ]]; then
              echo "Version $VERSION has already been released." >&2
              exit 1
            fi
            if [[ "$HIGHEST_VERSION" != "$VERSION" ]]; then
              echo "Version $VERSION must be higher than the latest released version $LATEST_VERSION." >&2
              exit 1
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and test release artifacts
        run: mvn --batch-mode clean verify

      - name: Verify release artifacts
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test -f "target/typedmemory-$VERSION.jar"
          test -f "target/typedmemory-$VERSION-sources.jar"
          test -f "target/typedmemory-$VERSION-javadoc.jar"

      - name: Create GitHub Release and upload artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(steps.version.outputs.version, '-') }}
        run: |
          set -euo pipefail

          OPTIONS=(--title "Release $TAG" --generate-notes --target "$GITHUB_SHA")
          if [[ "$PRERELEASE" == "true" ]]; then
            OPTIONS+=(--prerelease)
          fi

          gh release create "$TAG" \
            "target/typedmemory-$VERSION.jar" \
            "target/typedmemory-$VERSION-sources.jar" \
            "target/typedmemory-$VERSION-javadoc.jar" \
            "${OPTIONS[@]}"
